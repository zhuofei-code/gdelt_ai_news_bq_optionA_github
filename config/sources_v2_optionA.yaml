metadata:
  version: optionA_5mainstream_5specialist_provisional
  created_utc: 2026-03-11T00:00:00Z
  selection_status: provisional_pre_profiling
  note: >
    This file records a 10-outlet-per-country candidate set for Option A
    (5 mainstream + 5 specialist). Mainstream domains follow the March 2026
    domain screening report. Specialist domains were selected heuristically
    and must still pass SQL host profiling before production extraction.
  profiling_requirements:
    active_months_min: 70
    active_months_total: 84
    median_monthly_records_min: 30
    field_concentration_share_min: 0.35
    maximum_single_month_share_max: 0.35
    duplicate_content_ratio_max: 0.25
